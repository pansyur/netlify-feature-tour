version: 2.1

parameters:
  FILEBIN_NAME:
    type: string
    default: Sahaujwsh

jobs:
  upload_file:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - run:
          name: Create test file
          command: |
            echo "This is a test file" > testfile.txt

      - run:
          name: Upload file to Filebin
          command: |
            RESPONSE=$(curl -s -X POST -H "Content-Type: application/octet-stream" --data-binary @testfile.txt https://filebin.net/)
            # The response is the URL of the uploaded file
            echo "File uploaded to: $RESPONSE"
