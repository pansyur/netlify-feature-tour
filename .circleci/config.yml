version: 2.1

jobs:
  create_and_upload:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Create test file
          command: |
            echo "This is a test file" > testfile.txt

      - run:
          name: Upload file to Filebin
          command: |
            RESPONSE=$(curl -s -X POST --data-binary @testfile.txt https://filebin.net/)
            echo "File uploaded to: $RESPONSE"
            # Optional: store URL as output
            echo "export UPLOAD_URL=$RESPONSE" >> $BASH_ENV

workflows:
  version: 2
  upload_workflow:
    jobs:
      - create_and_upload
