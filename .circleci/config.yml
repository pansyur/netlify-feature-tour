version: 2.1

jobs:
  create_and_upload:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Create test file
          command: |
            echo "This is a test file" > testfile.txt

      - run:
          name: Upload file to Filebin with filename
          command: |
            RESPONSE=$(curl -s -X POST -F "file=@testfile.txt;filename=mytestfile.txt" https://filebin.net/)
            echo "File uploaded to: $RESPONSE"
            # Save URL for further use if needed
            echo "export UPLOAD_URL=$RESPONSE" >> $BASH_ENV

workflows:
  version: 2
  upload_workflow:
    jobs:
      - create_and_upload
