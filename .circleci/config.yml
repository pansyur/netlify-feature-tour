version: 2.1

jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            npm install webtorrent-cli
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
            pip install awscli

      - run:
          name: Download torrent
          command: |
            npx webtorrent download "magnet:?xt=urn:btih:73630FD012B6DC42C3F4B07BD7FD19138C8C9C3F&dn=Pie+to+Die+For+A+Hannah+Swensen+Mystery+2025+1080p+WEB-DL+HEVC+x265+BONE&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fexodus.desync.com%3A6969%2Fannounce&tr=udp%3A%2F%2Fopen.demonii.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce&tr=udp%3A%2F%2Fopen.stealth.si%3A80%2Fannounce&tr=udp%3A%2F%2Fp4p.arenabg.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.dler.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.cyberia.is%3A6969%2Fannounce&tr=udp%3A%2F%2Fexplodie.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.coppersurfer.tk%3A6969%2Fannounce&tr=udp%3A%2F%2F9.rarbg.to%3A2710%2Fannounce&tr=udp%3A%2F%2Ftracker.leechers-paradise.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.open-internet.nl%3A6969%2Fannounce&tr=udp%3A%2F%2Fopen.demonii.si%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.pirateparty.gr%3A6969%2Fannounce&tr=udp%3A%2F%2Fdenis.stalker.upeer.me%3A6969%2Fannounce" --out ./downloads --quiet

      - run:
          name: Configure AWS CLI for Filebase
          command: |
            mkdir -p ~/.aws
            echo "[default]" > ~/.aws/credentials
            echo "aws_access_key_id=${B2_ACCOUNT_ID}" >> ~/.aws/credentials
            echo "aws_secret_access_key=${B2_ACCOUNT_KEY}" >> ~/.aws/credentials

      - run:
          name: Upload files to Filebase
          command: |
            aws s3 cp ./downloads/ s3://${B2_BUCKET_NAME}/ --recursive --endpoint-url https://s3.filebase.com

workflows:
  version: 2
  upload_workflow:
    jobs:
      - download_and_upload
