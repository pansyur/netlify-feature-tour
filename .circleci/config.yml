jobs:
  download_and_upload:
    docker:
      - image: cimg/node:18.17
    timeout: 30m  # set longer timeout if needed
    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            npm install webtorrent-cli
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
            pip3 install requests

      - run:
          name: Download torrent
          command: |
            npx webtorrent download "magnet:?xt=urn:btih:73630FD012B6DC42C3F4B07BD7FD19138C8C9C3F&dn=Pie+to+Die+For+A+Hannah+Swensen+Mystery+2025+1080p+WEB-DL+HEVC+x265+BONE&tr=udp%3A%2F%2Ftracker.opentrackr.org%3A1337%2Fannounce&tr=udp%3A%2F%2Fexodus.desync.com%3A6969%2Fannounce&tr=udp%3A%2F%2Fopen.demonii.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.torrent.eu.org%3A451%2Fannounce&tr=udp%3A%2F%2Fopen.stealth.si%3A80%2Fannounce&tr=udp%3A%2F%2Fp4p.arenabg.com%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.dler.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.cyberia.is%3A6969%2Fannounce&tr=udp%3A%2F%2Fexplodie.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.coppersurfer.tk%3A6969%2Fannounce&tr=udp%3A%2F%2F9.rarbg.to%3A2710%2Fannounce&tr=udp%3A%2F%2Ftracker.leechers-paradise.org%3A6969%2Fannounce&tr=udp%3A%2F%2Ftracker.open-internet.nl%3A6969%2Fannounce&tr=udp%3A%2F%2Fopen.demonii.si%3A1337%2Fannounce&tr=udp%3A%2F%2Ftracker.pirateparty.gr%3A6969%2Fannounce&tr=udp%3A%2F%2Fdenis.stalker.upeer.me%3A6969%2Fannounce" --out ./downloads --quiet

      - run:
          name: Create Python upload script
          command: |
            cat \<<'EOF' > upload_files.py
            import os
            import requests
            import concurrent.futures

            url_template = 'https://filebin.net/Sahaujwsh/{filename}'

            def upload_file(file_path):
                filename = os.path.basename(file_path)
                url = url_template.format(filename=filename)
                print(f'Starting upload: {filename}')
                with open(file_path, 'rb') as f:
                    response = requests.post(url, headers={
                        'accept': 'application/json',
                        'Content-Type': 'application/octet-stream'
                    }, data=f)
                try:
                    response_data = response.json()
                except Exception:
                    response_data = response.text
                print(f'Finished upload: {filename} with status {response.status_code}')
                return filename, response.status_code, response_data

            files = [os.path.join('./downloads', f) for f in os.listdir('./downloads') if os.path.isfile(os.path.join('./downloads', f))]

            with concurrent.futures.ThreadPoolExecutor() as executor:
                futures = [executor.submit(upload_file, file) for file in files]
                for future in concurrent.futures.as_completed(futures):
                    filename, status_code, response_data = future.result()
                    print(f'Uploaded {filename}: Status {status_code}, Response: {response_data}')
            EOF

      - run:
          name: Execute upload script
          command: |
            python3 upload_files.py
            
  workflows:
  version: 2
  upload_workflow:
    jobs:
      - download_and_upload
