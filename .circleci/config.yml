version: 2.1

jobs:
  download_and_upload_to_filebase:
    docker:
      - image: cimg/python:3.10
    environment:
      TORRENT_MAGNET: "magnet:?xt=urn:btih:73630FD012B6DC42C3F4B07BD7FD19138C8C9C3F&dn=Pie+to+Die+For+A+Hannah+Swensen+Mystery+2025+1080p+WEB-DL+HEVC+x265+BONE&tr=udp://tracker.opentrackr.org:1337/announce&tr=udp://exodus.desync.com:6969/announce&tr=udp://open.demonii.com:1337/announce&tr=udp://tracker.torrent.eu.org:451/announce&tr=udp://open.stealth.si:80/announce&tr=udp://p4p.arenabg.com:1337/announce&tr=udp://tracker.dler.org:6969/announce&tr=udp://tracker.cyberia.is:6969/announce&tr=udp://explodie.org:6969/announce&tr=udp://tracker.coppersurfer.tk:6969/announce&tr=udp://9.rarbg.to:2710/announce&tr=udp://tracker.leechers-paradise.org:6969/announce&tr=udp://tracker.open-internet.nl:6969/announce&tr=udp://open.demonii.si:1337/announce&tr=udp://tracker.pirateparty.gr:6969/announce&tr=udp://denis.stalker.upeer.me:6969/announce"
      FILEBASE_BUCKET: arielle
      FILEBASE_ENDPOINT: https://s3.filebase.com
    steps:
      - checkout

      - run:
          name: Install tools
          command: |
            sudo apt install -y nodejs npm
            python -m pip install awscli
            npm install -g webtorrent-cli

      - run:
          name: Configure AWS CLI for Filebase
          command: |
            mkdir -p ~/.aws

            cat > ~/.aws/credentials <<EOF
            [default]
            aws_access_key_id = $FILEBASE_ACCESS_KEY
            aws_secret_access_key = $FILEBASE_SECRET_KEY
            EOF

            cat > ~/.aws/config <<EOF
            [default]
            region = us-east-1
            output = json
            s3 =
              endpoint_url = $FILEBASE_ENDPOINT
EOF

      - run:
          name: Download torrent
          command: |
            mkdir -p downloads
            webtorrent download "$TORRENT_MAGNET" --out downloads --quiet || echo "Download attempt finished"

      - run:
          name: Upload to Filebase and print URLs
          command: |
            ENDPOINT_HOST=$(echo $FILEBASE_ENDPOINT | sed 's~https://~~')
            find downloads -type f | while read -r FILE; do
              BASENAME=$(basename "$FILE")
              echo "Uploading $FILE to s3://$FILEBASE_BUCKET/$BASENAME"
              aws --endpoint-url "$FILEBASE_ENDPOINT" s3 cp "$FILE" "s3://$FILEBASE_BUCKET/$BASENAME" --acl public-read
              echo "📦 Public URL: https://$ENDPOINT_HOST/$FILEBASE_BUCKET/$BASENAME"
            done

workflows:
  version: 2
  upload-workflow:
    jobs:
      - download_and_upload_to_filebase
